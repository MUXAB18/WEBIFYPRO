  <!-- App Shell — visible instantly, before JS loads -->
  <style>
    #app-shell {
      position: fixed; inset: 0; z-index: 99999;
      background: #000000;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 32px;
      transition: opacity 0.4s ease;
    }
    #app-shell.fade-out { opacity: 0; pointer-events: none; }
    
    #app-shell-logo {
      display: flex; flex-direction: column; align-items: center; gap: 20px;
    }
    
    .shell-logo-img {
      width: 72px; height: 72px; object-fit: contain;
      filter: drop-shadow(0 0 15px rgba(30,111,234,0.6));
      animation: shell-pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }

    #app-shell-wordmark {
      display: flex; align-items: baseline; gap: 2px;
      font-family: 'Outfit', system-ui, sans-serif;
    }
    
    .shell-text-white {
      font-size: 1.4rem; font-weight: 800; color: #ffffff; letter-spacing: -0.5px;
    }
    
    .shell-text-blue {
      font-size: 1.4rem; font-weight: 800; letter-spacing: -0.5px;
      background: linear-gradient(135deg, #0B3D91 0%, #1E6FEA 50%, #00D4FF 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    
    #app-shell-bars {
      display: flex; flex-direction: column; align-items: center; gap: 8px;
      width: min(280px, 70vw);
    }
    
    .shell-bar {
      height: 4px; border-radius: 4px;
      background: linear-gradient(90deg,
        rgba(30,111,234,0.1) 25%,
        rgba(0,212,255,0.4) 50%,
        rgba(30,111,234,0.1) 75%
      );
      background-size: 200% 100%;
      animation: shell-shimmer 1.5s ease-in-out infinite;
    }
    
    .shell-bar:nth-child(1) { width: 100%; animation-delay: 0s; }
    .shell-bar:nth-child(2) { width: 60%;  animation-delay: 0.15s; }
    
    @keyframes shell-pulse {
      0%, 100% { transform: scale(1); filter: drop-shadow(0 0 15px rgba(30,111,234,0.5)); }
      50% { transform: scale(1.05); filter: drop-shadow(0 0 25px rgba(0,212,255,0.7)); }
    }
    @keyframes shell-shimmer {
      0%   { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }
  </style>

  <div id="app-shell">
